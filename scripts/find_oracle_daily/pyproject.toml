[project]
name = "find-oracle-daily"
version = "0.1.0"
description = "Resolve an Ubuntu daily image on Oracle Cloud to exactly one image OCID."
readme = "README.md"
authors = [
    { name = "Stefan Hammer", email = "stefan.hammer@canonical.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
find-oracle-daily = "find_oracle_daily.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
